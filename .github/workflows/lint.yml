name: Lint

on:
  push:
    paths-ignore:
      - '.github/**'
      - 'fastlane/**'
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies with mise
        uses: jdx/mise-action@v3

      - name: Install dependencies
        run: pnpm install

      - name: Check formatting
        run: pnpm lint

      - name: Run Svelte and TypeScript checks
        run: pnpm check
